name: IME test installers

on:
  push:
    branches:
      - 'build/ime-test-installers*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ime-test-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            runner: windows-2022
            os: windows
            arch: amd64
            qt-version: 6.11.3
            vcpkg-triplet: x64-windows-release
            config-args: -G Ninja
          - name: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            qt-version: 6.11.3
            vcpkg-triplet: arm64-windows
            config-args: -G Ninja
          - name: macos-arm64
            runner: macos-15
            os: macos
            qt-version: 6.11.3
            config-args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14
          - name: macos-x64
            runner: macos-15-intel
            os: macos
            qt-version: 6.9.3
            config-args: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12 -DCMAKE_OSX_SYSROOT=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
    steps:
      - name: Checkout test source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup VC++
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.arch }}
          spectre: true

      - name: Install dependencies
        id: deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Configure
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=ON \
            -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DPACKAGE_VERSION_LABEL="ime-test-${GITHUB_SHA:0:8}" \
            ${{ matrix.target.config-args }} ${{ steps.deps.outputs.vcpkg-cmake-config }}

      - name: Build installer
        id: package
        shell: bash
        run: |
          cmake --build build --config Release --parallel 8
          if [ "$RUNNER_OS" != "macOS" ]; then
            cmake --build build --config Release --parallel 8 --target package
            test -n "$(find build -maxdepth 1 -name '*.msi' -print -quit)"
          else
            for attempt in 1 2 3 4 5; do
              if cmake --build build --config Release --parallel 8 --target package; then
                test -n "$(find build -maxdepth 1 -name '*.dmg' -print -quit)"
                exit 0
              fi
              echo "Retrying DMG packaging (attempt $attempt)"
              sleep 1
            done
            exit 1
          fi

      - name: Verify packaged executable
        uses: ./.github/actions/test-package

      - name: Native unit tests
        id: tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests --output-on-failure

      - name: Package build information and checksums
        if: always() && steps.package.outcome == 'success'
        shell: bash
        run: |
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Platform: ${{ matrix.target.name }}"
            echo "Native unit tests: ${{ steps.tests.outcome }}"
            echo "Test installer. No Apple Developer ID notarization or Windows signing certificate is used."
            echo "Enable the Caps Lock option in Mac Server Configuration > Advanced > Misc."
            echo "Enable keyboard language synchronization on the Windows client for Chinese/English mode."
          } > build/BUILD-INFO.txt
          if [ "$RUNNER_OS" == "macOS" ]; then
            (cd build && shasum -a 256 *.dmg > SHA256SUMS.txt)
          else
            (cd build && sha256sum *.msi > SHA256SUMS.txt)
          fi

      - name: Upload installer
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-ime-test-${{ matrix.target.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/*.msi
            build/*.dmg
            build/BUILD-INFO.txt
            build/SHA256SUMS.txt
            build/src/unittests/Testing/Temporary/LastTest.log
