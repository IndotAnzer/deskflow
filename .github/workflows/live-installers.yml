name: Input sync without Mac comparator changes test installers

on:
  push:
    branches:
      - 'build/ime-no-comparator'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ime-test-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            runner: windows-2022
            os: windows
            arch: amd64
            qt-version: 6.11.3
            vcpkg-triplet: x64-windows-release
            config-args: -G Ninja
          - name: macos-arm64
            runner: macos-15
            os: macos
            qt-version: 6.11.3
            config-args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14
    steps:
      - name: Checkout test source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup VC++
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.arch }}
          spectre: true

      - name: Install dependencies
        id: deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Configure
        shell: bash
        run: |
          cmake_args=()
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake_args+=("-DCMAKE_TOOLCHAIN_FILE=$(pwd -W)/vcpkg/scripts/buildsystems/vcpkg.cmake")
            cmake_args+=("-DVCPKG_TARGET_TRIPLET=${{ matrix.target.vcpkg-triplet }}" "-DVCPKG_MANIFEST_MODE=OFF")
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=ON \
            -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DPACKAGE_VERSION_LABEL="ime-no-comparator-${GITHUB_SHA:0:8}" \
            ${{ matrix.target.config-args }} "${cmake_args[@]}"

      - name: Build installer
        id: package
        shell: bash
        run: |
          cmake --build build --config Release --parallel 8
          if [ "$RUNNER_OS" != "macOS" ]; then
            cmake --build build --config Release --parallel 8 --target package
            test -n "$(find build -maxdepth 1 -name '*.msi' -print -quit)"
          else
            for attempt in 1 2 3 4 5; do
              if cmake --build build --config Release --parallel 8 --target package; then
                test -n "$(find build -maxdepth 1 -name '*.dmg' -print -quit)"
                exit 0
              fi
              echo "Retrying DMG packaging (attempt $attempt)"
              sleep 1
            done
            exit 1
          fi

      - name: Verify packaged executable
        uses: ./.github/actions/test-package

      - name: Validate signatures and start packaged GUI
        if: runner.os == 'macOS'
        run: |
          dmg=$(find build -maxdepth 1 -name '*.dmg' -print -quit)
          echo Y | hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/deskflow-signfix-dmg
          trap 'hdiutil detach /tmp/deskflow-signfix-dmg' EXIT
          ditto /tmp/deskflow-signfix-dmg/Deskflow.app /tmp/Deskflow-signfix.app
          app=/tmp/Deskflow-signfix.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>build/GUI-SIGNATURE.txt
          codesign -dv --verbose=4 "$app/Contents/Frameworks/QtWidgets.framework" 2>build/QTWIDGETS-SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          gui = Path('build/GUI-SIGNATURE.txt').read_text()
          qt = Path('build/QTWIDGETS-SIGNATURE.txt').read_text()
          print(gui, qt)
          assert 'TeamIdentifier=not set' in gui
          assert 'TeamIdentifier=not set' in qt
          assert not any('runtime' in line for line in gui.splitlines() if line.startswith('CodeDirectory '))
          PY
          env -u QT_PLUGIN_PATH -u QT_ROOT_DIR -u QML2_IMPORT_PATH \
            -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            "$app/Contents/MacOS/Deskflow" --version >build/GUI-STARTUP.txt 2>&1
          cat build/GUI-STARTUP.txt
          env -u QT_PLUGIN_PATH -u QT_ROOT_DIR -u QML2_IMPORT_PATH \
            -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            "$app/Contents/MacOS/deskflow-core" --version
      - name: Native unit tests
        id: tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests --output-on-failure

      - name: Install previous test MSI for upgrade validation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37176570588 -R IndotAnzer/deskflow -n deskflow-ime-before-typing-windows-x64 -D previous-installer
          if ($LASTEXITCODE -ne 0) { throw "Could not download previous test installer" }
          $oldMsi = (Get-ChildItem previous-installer -Filter *.msi -Recurse | Select-Object -First 1).FullName
          if (-not $oldMsi) { throw "Previous MSI was not found" }
          $oldLog = Join-Path $env:GITHUB_WORKSPACE 'build/MSI-PREVIOUS-INSTALL.log'
          $old = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $oldMsi + '"'), '/qn', '/norestart', '/L*V', ('"' + $oldLog + '"')) -Wait -PassThru
          if ($old.ExitCode -notin @(0, 3010)) { Get-Content $oldLog -Tail 100; throw "Previous MSI installation failed: $($old.ExitCode)" }

      - name: Upgrade MSI and verify installed executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/*.msi | Select-Object -First 1).FullName
          $log = Join-Path $env:GITHUB_WORKSPACE "build/MSI-INSTALL.log"
          $args = @('/i', ('"' + $msi + '"'), '/qn', '/norestart', '/L*V', ('"' + $log + '"'))
          $install = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content $log -Tail 100
            throw "MSI installation failed: $($install.ExitCode)"
          }
          $root = Join-Path $env:ProgramFiles 'Deskflow'
          $core = Get-ChildItem $root -Filter deskflow-core.exe -Recurse | Select-Object -First 1
          if (-not $core) { throw "Installed deskflow-core.exe was not found" }
          $version = & $core.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Installed core failed to start: $LASTEXITCODE" }
          $version
          if ("$version" -notmatch '1\.27\.4\.') { throw "Upgraded core does not report the expected test version: $version" }
          $removeLog = Join-Path $env:GITHUB_WORKSPACE "build/MSI-UNINSTALL.log"
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', ('"' + $msi + '"'), '/qn', '/norestart', '/L*V', ('"' + $removeLog + '"')) -Wait -PassThru
          if ($remove.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($remove.ExitCode)" }

      - name: Package build information and checksums
        shell: bash
        run: |
          {
            echo "Package commit: $GITHUB_SHA"
            echo "Draft source commit: 6e7b93105db969d215534c104196ddcf6cc90ee1"
            echo "Installer-only test version: 1.27.4.9999; upstream version unchanged."
            echo "Input state synchronizes before the next real keystroke; no immediate input-source message."
            echo "Mac comparator and active-group lookup restored to upstream behavior."
            echo "Uses Qt ISO 639-1 conversion and dynamically sized Windows language buffers."
            echo "Existing upstream PR branches are unchanged."
            echo "Platform: ${{ matrix.target.name }}"
            echo "Native unit tests: ${{ steps.tests.outcome }}"
            echo "Test installer. No Apple Developer ID notarization or Windows signing certificate is used."
            echo "Enable the Caps Lock option in Mac Server Configuration > Advanced > Misc."
            echo "Enable keyboard language synchronization on the Windows client for Chinese/English mode."
          } > build/BUILD-INFO.txt
          if [ "$RUNNER_OS" == "macOS" ]; then
            (cd build && shasum -a 256 *.dmg > SHA256SUMS.txt)
          else
            (cd build && sha256sum *.msi > SHA256SUMS.txt)
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-ime-no-comparator-${{ matrix.target.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/*.msi
            build/*.dmg
            build/BUILD-INFO.txt
            build/SHA256SUMS.txt
            build/src/unittests/Testing/Temporary/LastTest.log
            build/GUI-SIGNATURE.txt
            build/QTWIDGETS-SIGNATURE.txt
            build/GUI-STARTUP.txt
            build/MSI-INSTALL.log
            build/MSI-PREVIOUS-INSTALL.log
            build/MSI-UNINSTALL.log

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-live-diagnostics-${{ matrix.target.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/MSI-*.log
            build/GUI-*.txt
            build/QTWIDGETS-SIGNATURE.txt
            build/src/unittests/Testing/Temporary/LastTest.log
